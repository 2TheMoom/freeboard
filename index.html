<!doctype html>
<html lang="en">
<head>

  <link rel="shortcut icon" href="/brand/favicon/favicon.ico">
  <link rel="apple-touch-icon" href="/brand/favicon/apple-touch-icon.png">
  <link rel="manifest" href="/brand/favicon/site.webmanifest">
  <meta name="theme-color" content="#0E1613">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Freeboard">

  <link rel="stylesheet" href="/brand/tokens/tokens.css">
  <style>
    *{box-sizing:border-box;}
    html,body{margin:0;height:100%;}
    body{
      background:var(--bg);
      color:var(--text);
      font-family:var(--font-body);
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      padding:24px;
    }
    .lockup{display:flex;align-items:center;gap:20px;}
    .lockup svg{width:56px;height:56px;flex-shrink:0;}
    .lockup h1{
      font-family:var(--font-display);
      font-weight:500;
      font-size:clamp(32px,7vw,52px);
      margin:0;
      letter-spacing:-0.01em;
    }
    .tagline{
      margin:22px 0 0;
      font-family:var(--font-mono);
      font-size:12.5px;
      letter-spacing:0.08em;
      text-transform:uppercase;
      color:var(--text-dim);
      text-align:center;
    }
    .wrap{display:flex;flex-direction:column;align-items:center;}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="lockup">
      <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <rect x="6" y="32" width="52" height="18" fill="var(--water)" opacity="0.22"/>
        <path d="M9,24 Q32,12 55,24 L55,40 Q32,50 9,40 Z" stroke="var(--text)" stroke-width="2.4" fill="none" stroke-linejoin="round"/>
        <line x1="4" y1="32" x2="60" y2="32" stroke="var(--accent)" stroke-width="2.8" stroke-linecap="round"/>
      </svg>
      <h1>Freeboard</h1>
    </div>
    <p class="tagline">Bridge / protocol health registry — coming soon</p>
  </div>
</body>
</html>
